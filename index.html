<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EzyAccount</title>
  <script src="https://accounts.google.com/gsi/client" async defer onload="onGISLoaded()"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
    }
    .main-logo {
      width: 200px;
      height: auto;
      margin-bottom: 12px;
    }
    .login-title {
      font-size: 14px;
      color: #666;
      margin-bottom: 36px;
      text-align: center;
    }
    .btn-google {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 14px;
      padding: 14px 24px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #111;
      width: 100%;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: box-shadow .2s;
    }
    .btn-google:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .google-svg { width: 22px; height: 22px; flex-shrink: 0; }
    .kekal-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: 18px; cursor: pointer;
      font-size: 14px; color: #6b7280;
    }
    .kekal-row input { width: 18px; height: 18px; accent-color: #1a7a4a; cursor: pointer; }
    .login-loading {
      display: none;
      font-size: 13px;
      color: #1a7a4a;
      margin-top: 16px;
    }

    /* ── COMPANY SCREEN ── */
    #companyScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
    }
    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,.08);
      margin-bottom: 24px;
    }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
    }
    .user-avatar-fallback {
      width: 36px; height: 36px; border-radius: 50%;
      background: #1a7a4a; color: #fff;
      display: none; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .user-bar-name { font-size: 14px; font-weight: 600; color: #111; }
    .user-bar-email { font-size: 11px; color: #888; }
    .user-bar-right { margin-left: auto; }
    .btn-logout {
      font-size: 12px; font-weight: 500; color: #dc2626;
      background: none; border: 1px solid #dc2626;
      border-radius: 8px; padding: 5px 10px; cursor: pointer;
    }
    .btn-logout:hover { background: #fee2e2; }
    .company-head {
      text-align: center;
      margin-bottom: 20px;
    }
    .main-logo-sm {
      width: 120px;
      height: auto;
      margin-bottom: 6px;
    }
    .company-head p { font-size: 13px; color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 14px;
      width: 100%;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px 12px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border: 2px solid transparent;
      transition: all 0.2s;
      text-decoration: none;
      display: block;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    /* Logo wrapper — coloured background so white logos show up */
    .card-logo-wrap {
      width: 56px; height: 56px;
      border-radius: 12px;
      margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card-logo {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .card-emoji {
      font-size: 28px;
      display: none; /* shown via JS if img fails */
    }
    .card .name {
      font-size: 13px;
      font-weight: 600;
      color: #1a3a2a;
    }
    .card .sub {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    /* ── LOADING ── */
    #loadingScreen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #1a7a4a;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #d1fae5;
      border-top-color: #1a7a4a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 36px;
      font-size: 11px;
      color: #bbb;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <img class="main-logo" src="logo/main.jpg" alt="EzyAccount"
    onerror="this.style.display='none';document.getElementById('loginFallback').style.display='block'">
  <div id="loginFallback" style="display:none;font-size:30px;font-weight:800;color:#1a7a4a;margin-bottom:12px">
    ezy<span style="color:#333">account</span>
  </div>
  <div class="login-title">smart staff, ezy working</div>
  <button class="btn-google" onclick="doLogin()">
    <svg class="google-svg" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Log Masuk dengan Google
  </button>
  <label class="kekal-row">
    <input type="checkbox" id="kekalCheck"> Kekal Log Masuk
  </label>
  <div class="login-loading" id="loginLoading">⏳ Sedang log masuk...</div>
</div>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="spinner"></div>
  <div>Memuat maklumat...</div>
</div>

<!-- COMPANY SELECT -->
<div id="companyScreen">
  <div class="user-bar">
    <img id="userPic" class="user-avatar" src="" alt=""
      onerror="this.style.display='none';document.getElementById('userPicFallback').style.display='flex'">
    <div id="userPicFallback" class="user-avatar-fallback"></div>
    <div>
      <div class="user-bar-name" id="userName"></div>
      <div class="user-bar-email" id="userEmail"></div>
    </div>
    <div class="user-bar-right">
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </div>
  <div class="company-head">
    <img class="main-logo-sm" src="logo/main.jpg" alt="EzyAccount" onerror="this.style.display='none'">
    <p>Pilih syarikat untuk masuk</p>
  </div>
  <div class="grid" id="companyGrid"></div>
</div>

<div class="footer">EzyAccount · v1.2-2706/1521</div>

<script>
const COMPANIES = [
  { id:'ezysupplier',       name:'Ezy Supplier',    sub:'Durian Supply', logo:'logo/supplier.png', emoji:'🌳', color:'#1a7a4a', bg:'#e8f5ee', path:'ezysupplier/index.html' },
  { id:'ezybranch',         name:'Ezy Branch',      sub:'Cawangan',      logo:'logo/Branch.png',   emoji:'🏪', color:'#2d9e62', bg:'#e8f5ee', path:'ezybranch/index.html'   },
  { id:'ezybakery',         name:'Ezy Bakery',      sub:'Bakeri',        logo:'logo/bakery.png',   emoji:'🥐', color:'#f59e0b', bg:'#fffbeb', path:'ezybakery/index.html'   },
  { id:'ezycafe',           name:'Ezy Cafe',        sub:'Kafe',          logo:'logo/cafe.jpg',     emoji:'☕', color:'#8b5cf6', bg:'#f5f3ff', path:'ezycafe/index.html'     },
  { id:'ezysentralkitchen', name:'Sentral Kitchen', sub:'Dapur Pusat',   logo:'logo/kitchen.png',  emoji:'🍳', color:'#ef4444', bg:'#fff1f2', path:'ezysentralkitchen/index.html' },
];

function lsGet(k,def=null){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}

let tokenClient=null, gisReady=false, currentToken=null;

function onGISLoaded(){
  gisReady=true;
  tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:'27154479564-ufljm52nmlh4gg7ie54knphff44jvrrq.apps.googleusercontent.com',
    scope:'https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
    callback:handleTokenResponse,
  });
  autoLogin();
}

function doLogin(){
  if(!gisReady||!tokenClient){
    setTimeout(()=>{if(gisReady&&tokenClient)tokenClient.requestAccessToken({prompt:'select_account'});},800);
    return;
  }
  document.getElementById('loginLoading').style.display='block';
  tokenClient.requestAccessToken({prompt:'select_account'});
}

async function handleTokenResponse(resp){
  if(resp.error){document.getElementById('loginLoading').style.display='none';return;}
  currentToken=resp.access_token;
  const expiry=Date.now()+(resp.expires_in||3599)*1000;
  const kekal=document.getElementById('kekalCheck').checked;
  if(kekal){
    lsSet('ezy_landing_token',currentToken);
    lsSet('ezy_landing_expiry',expiry);
    lsSet('ezy_kekal',true);
  }
  showScreen('loadingScreen');
  await fetchUser();
}

async function fetchUser(){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{Authorization:'Bearer '+currentToken}});
    const u=await r.json();
    if(!u||!u.email)throw new Error('no email');
    lsSet('ezy_user',u);
    showCompanyScreen(u);
  }catch(e){console.error(e);showScreen('loginScreen');}
}

function autoLogin(){
  const kekal=lsGet('ezy_kekal',false);
  if(!kekal)return;
  const token=lsGet('ezy_landing_token',null);
  const expiry=lsGet('ezy_landing_expiry',0);
  const user=lsGet('ezy_user',null);
  if(token&&expiry>Date.now()&&user){currentToken=token;showCompanyScreen(user);}
}

function showCompanyScreen(u){
  document.getElementById('userPic').src=u.picture||'';
  document.getElementById('userName').textContent=u.name||'';
  document.getElementById('userEmail').textContent=u.email||'';
  // fallback initial
  const fb=document.getElementById('userPicFallback');
  fb.textContent=(u.name||u.email||'?')[0].toUpperCase();

  const grid=document.getElementById('companyGrid');
  grid.innerHTML='';
  COMPANIES.forEach(c=>{
    const a=document.createElement('a');
    a.className='card';
    a.href=c.path;
    a.style.borderColor=c.color+'30';
    a.innerHTML=`
      <div class="card-logo-wrap" style="background:${c.bg}">
        <img class="card-logo" src="${c.logo}" alt="${c.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="card-emoji">${c.emoji}</span>
      </div>
      <div class="name">${c.name}</div>
      <div class="sub">${c.sub}</div>
    `;
    grid.appendChild(a);
  });
  showScreen('companyScreen');
}

function doLogout(){
  localStorage.removeItem('ezy_landing_token');
  localStorage.removeItem('ezy_landing_expiry');
  localStorage.removeItem('ezy_kekal');
  localStorage.removeItem('ezy_user');
  currentToken=null;
  showScreen('loginScreen');
}

function showScreen(id){
  ['loginScreen','loadingScreen','companyScreen'].forEach(s=>{
    document.getElementById(s).style.display=(s===id)?'flex':'none';
  });
}
</script>
</body>
</html>
